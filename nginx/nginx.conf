events {}

http {
    # Photos de frigo : on autorise des uploads confortables
    client_max_body_size 25M;

    upstream frontend { server frontend:8501; }
    upstream api      { server api:8000; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # API FastAPI (docs : /api/docs)
        location /api/ {
            proxy_pass http://api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Prefix /api;
            # YOLO + BigQuery peuvent prendre du temps
            proxy_read_timeout 300s;
        }

        # Front Streamlit (a besoin des websockets)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }
    }
}
